services:
  - type: web
    name: cartaholics
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: SELLER_PIN
        sync: false
